<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>{% block title %}Game Deal Scraper{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        <header class="site-header">
            <a href="{{ url_for('index') }}" class="brand">
                <span class="brand-mark" aria-hidden="true">🎮</span>
                <span>Game Deal Scraper</span>
            </a>
            <nav class="site-nav" aria-label="Navigazione principale">
                <a href="{{ url_for('index') }}">Cerca</a>
                <a href="{{ url_for('wishlist') }}" class="wishlist-nav-link">
                    Wishlist
                    <span class="wishlist-count" data-wishlist-count aria-label="0 giochi salvati">0</span>
                </a>
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/filters.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/wishlist.js') }}" defer></script>
</body>
</html>
